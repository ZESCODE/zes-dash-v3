<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZES OS Dashboard — Fleet</title>
  <link rel="stylesheet" href="/css/dark-bg.css" />
  <link rel="stylesheet" href="/css/frost-overrides.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar glass">
    <div class="brand">ZES&nbsp;OS&nbsp;<span class="accent">Dashboard v3</span></div>
    <nav id="nav">
      <a href="#/" data-route="/">Fleet</a>
      <a href="#/tasks" data-route="/tasks">Tasks</a>
      <a href="#/activity" data-route="/activity">Activity</a>
      <a href="#/infra" data-route="/infra">Infrastructure</a>
    </nav>
    <div id="clock" class="clock"></div>
  </header>
  <main id="app" class="app"></main>
  <footer class="foot glass">
    <span id="status-dot" class="dot gray"></span>
    <span id="status-text">connecting…</span>
    <span class="spacer"></span>
    <span class="muted">real-data · no fabricated values</span>
  </footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
