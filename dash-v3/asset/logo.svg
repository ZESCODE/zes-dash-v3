<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border Blue-to-Purple Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Inner Metallic Gradient for 'Z' -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Inner Dark Box Gradient -->
    <linearGradient id="innerDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151B" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Subtle Bevel & Outer Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 100% Solid #000000 Canvas Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Outer Rounded Bevel Border -->
  <rect x="64" y="64" width="384" height="384" rx="90" ry="90" fill="url(#borderGradient)" filter="url(#dropShadow)" />

  <!-- Inner Dark Frame -->
  <rect x="88" y="88" width="336" height="336" rx="66" ry="66" fill="url(#innerDark)" stroke="#1E293B" stroke-width="2" />

  <!-- Metallic 'Z' Symbol -->
  <path d="M 180 160 H 332 V 196 L 228 316 H 332 V 352 H 180 V 316 L 284 196 H 180 Z" 
        fill="url(#metalGradient)" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linejoin="round" />
</svg>


